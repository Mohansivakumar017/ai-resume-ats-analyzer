name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      GEMINI_API_KEY: "ci-dummy-key"
      TELEGRAM_BOT_TOKEN: "ci-dummy-token"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Syntax & Import Sanity Check
      run: |
        python -c "import src.config, src.services; print('All core modules imported cleanly!')"
        python -c "import bot, cli; print('CLI and Bot entrypoints imported cleanly!')"
